services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    image: wswt-bench-server:dev
    init: true
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    cpus: 2
    mem_limit: 1g
    volumes:
      - ${BENCH_TLS_DIR:-./build/tls}/server:/certs:ro
    networks:
      server_net:
        ipv4_address: 172.28.20.10
  browser:
    build:
      context: .
      dockerfile: docker/Dockerfile.browser
    image: wswt-bench-browser:dev
    init: true
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    entrypoint: ["sleep", "infinity"]
    shm_size: 1gb
    cpus: 2
    mem_limit: 3g
    extra_hosts: ["bench.test:172.28.20.10"]
    security_opt:
      - seccomp=docker/chromium-seccomp.json
    volumes:
      - ${BENCH_TLS_DIR:-./build/tls}/public:/trust:ro
    networks:
      browser_net:
        ipv4_address: 172.28.10.10
  router:
    build:
      context: .
      dockerfile: docker/Dockerfile.router
    image: wswt-bench-router:dev
    init: true
    cpus: 1
    mem_limit: 512m
    command: ["router"]
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
      net.ipv4.ip_forward: ${BENCH_FORWARD:-1}
    volumes:
      - ./configs/profiles.json:/profiles.json:ro
    networks:
      browser_net:
        ipv4_address: 172.28.10.2
      server_net:
        ipv4_address: 172.28.20.2
  analyzer:
    build:
      context: .
      dockerfile: docker/Dockerfile.analyzer
    image: wswt-bench-analyzer:dev
    network_mode: none
    profiles: [analysis]
    cpus: 2
    mem_limit: 2g
networks:
  browser_net:
    internal: true
    enable_ipv6: false
    ipam:
      config: [{subnet: 172.28.10.0/24}]
  server_net:
    internal: true
    enable_ipv6: false
    ipam:
      config: [{subnet: 172.28.20.0/24}]
